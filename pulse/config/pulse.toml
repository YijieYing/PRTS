timezone = "Asia/Tokyo"
day_start_hour = 5
gap_minutes = 20
cap_minutes = 20
chatgpt_cap_minutes = 45
held_cap_minutes = 60

[timing]
writing_chars_per_minute = 40
paste_chars_per_minute = 400
reading_chars_per_minute = 400
writing_cap_minutes = 15
reading_cap_minutes = 15
paste_min_chars = 400

[check]
window_minutes = 90
chore_ratio = 0.5
chore_minutes = 60
continuous_minutes = 30
cooldown_minutes = 180

[user]
idle_seconds = 600
quiet_start = "05:00"
quiet_end = "12:00"

[sources]
computer_events = "~/Library/Group Containers/2DC432GLL2.com.openai.sky.CUAService/Library/Caches/ComputerUse/Skysight/segments"
computer_summaries = "~/.codex/memories/extensions/skysight/resources"
claude = "~/.claude/projects"
titles = "~/Library/Application Support/Claude/claude-code-sessions"
codex = "~/.codex/sessions"
chrome = "~/Library/Application Support/Google/Chrome/Default/History"
projects = "~/PRTS/human/projects.toml"
reporter_config = "~/PRTS/reporter/config/config.toml"
repos = ["~/PRTS", "~/PRTS/AgentConsole", "~/research/*", "~/Projects/*"]

# Optional [[project]] entries use name, path and exact, as in human/projects.toml.
