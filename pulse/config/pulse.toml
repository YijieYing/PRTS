timezone = "Asia/Tokyo"
day_start_hour = 5
gap_minutes = 20
display_merge_minutes = 15
cap_minutes = 20
chatgpt_cap_minutes = 45
held_cap_minutes = 60

[recap]
idle_minutes = 90

[timing]
writing_chars_per_minute = 40
paste_chars_per_minute = 400
reading_chars_per_minute = 400
writing_cap_minutes = 15
reading_cap_minutes = 15
paste_min_chars = 400

[check]
window_minutes = 90
chore_ratio = 0.5
chore_minutes = 60
continuous_minutes = 30
cooldown_minutes = 180

[user]
idle_seconds = 600
quiet_start = "05:00"
quiet_end = "12:00"

[sources]
# Transient system surfaces belong to the last observed real foreground app.
system_apps = ["Simplified Chinese Input Method", "TextInputSwitcher", "Dock", "DockHelper", "Control Center", "Notification Center", "UserNotificationCenter", "Spotlight"]
system_context_seconds = 120
computer_events = "~/Library/Group Containers/2DC432GLL2.com.openai.sky.CUAService/Library/Caches/ComputerUse/Skysight/segments"
computer_summaries = "~/.codex/memories/extensions/skysight/resources"
claude = "~/.claude/projects"
titles = "~/Library/Application Support/Claude/claude-code-sessions"
codex = "~/.codex/sessions"
chrome = "~/Library/Application Support/Google/Chrome/Default/History"
projects = "~/PRTS/human/projects.toml"
reporter_config = "~/PRTS/reporter/config/config.toml"
repos = ["~/PRTS", "~/PRTS/AgentConsole", "~/research/*", "~/Projects/*"]

# Optional [[project]] entries use name, path and exact, as in human/projects.toml.

[ear]
source = "new"
devices = ["ear-ios-6da3feff-e786-43d5-b744-c26fad978100"]
window_minutes = 30
gap_minutes = 10
lookback_hours = 24
database = "~/.octopus/local/service/herryying30/octopus-service-ear/db/ear.sqlite3"
start_from = "2026-11-12T12:00:00+09:00"
min_chars = 300
continuation_gap_minutes = 30
max_push_per_day = 4
late_push_hours = 6
late_scan_days = 7      # 有入库水位时回扫多少天的录音；更早的迟到录音用 ear sync --since/--until 手动补
wait_gap_minutes = 40

[focus]
window_minutes = 20
off_minutes = 12
streak_minutes = 10
cooldown_minutes = 20
dnd_hours = 3

[[study]]
id = "reading"
title = "读论文（纸质）"
days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]
start = "21:00"
minutes = 45
mode = "offline"
dir = "~/research/Reading"
queue = "~/research/Reading/queue.md"   # 有它时提醒会带上当前这篇、推荐理由和进度

[[study]]
id = "french"
title = "法语"
days = ["Mon","Wed","Fri"]
start = "22:00"
minutes = 30
mode = "any"
on = ["法语", "French", "français", "Languages/french"]
dir = "~/research/Languages/french"

[[study]]
id = "japanese"
title = "日语"
days = ["Tue","Thu","Sat"]
start = "22:00"
minutes = 30
mode = "any"
on = ["日语", "Japanese", "日本語", "N1", "Languages/japanese"]
dir = "~/research/Languages/japanese"

[study_settings]
lead_minutes = 10
nag_minutes = 5
done_ratio = 0.6
makeup_start = "23:30"
