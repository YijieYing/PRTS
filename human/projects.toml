# 项目登记表（你可以直接改）。Reporter 周报和以后的话题路由都用它。
# path 是目录前缀（本机写 ~/...，lain 写 lain:/home/...），category 取：工程 / 学术 / 课程 / 总控 / 其他
# 最长前缀优先匹配；exact = true 表示只匹配这个目录本身。
# group = "大项目"：PRTS / 具身与果蝇脑 / 机器人硬件 / 课程 / 工具与赚钱 / Outreach（用户 11-16 定；Ear 属 PRTS，芯动属机器人硬件）。
# roadmap = "路径" 可选：这个工程自己的 ROADMAP，即它的 todo 来源。
# roadmap_prefix = "R" 可选：只取表格中编号以此前缀开头的条目；共享 ROADMAP 时区分工程。
# aliases = [...] 可选：同一项目的其他叫法（比如 ChatGPT 里的项目名），pulse 会归到 name 下。

[[project]]
name = "PRTS 总控台"
path = "~/PRTS"
category = "总控"
aliases = ["PRTS", "PRTS 总控台（主 session）"]   # 同一项目的其他叫法（ChatGPT 里的项目名、旧名）；pulse 归成一个
group = "PRTS"
roadmap = "~/PRTS/ROADMAP.md"
roadmap_prefix = "R"

[[project]]
name = "PRTS 研究"   # 研究层（E1–E5 实验），和总控台分开；登记后 cwd 不再落成裸名「PRTS」
path = "~/research/PRTS"
category = "学术"
group = "PRTS"
roadmap = "~/PRTS/human/roadmaps/PRTS研究.md"

